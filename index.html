<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NEXUS — Game Helper, Aim Trainer &amp; Sensitivity Lab</title>
<meta name="description" content="NEXUS is the pocket companion for competitive players: aim trainer, sensitivity converter, loadout lab, and boss codex. Train smarter, play better." />
<meta name="theme-color" content="#07070c" />
<meta name="color-scheme" content="dark" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="assets/icons/favicon-64.png" sizes="64x64" type="image/png" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NEXUS" />
<meta property="og:title" content="NEXUS — Your unfair advantage" />
<meta property="og:description" content="Aim trainer, sensitivity converter, loadout lab, and boss codex in one beautiful companion app." />
<meta property="og:type" content="website" />
<meta property="og:image" content="assets/icons/icon-512.png" />
<link rel="stylesheet" href="css/styles.css" />
<script type="module" src="js/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="ambient" aria-hidden="true">
  <span class="orb orb-a"></span>
  <span class="orb orb-b"></span>
  <span class="orb orb-c"></span>
  <span class="grid-fade"></span>
</div>

<header class="topbar">
  <a class="brand" href="#/home" aria-label="NEXUS home">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 40 40"><path d="M20 3.5 34.3 11.7v16.6L20 36.5 5.7 28.3V11.7z" fill="none" stroke="url(#brandGrad)" stroke-width="2.2"/><path d="M20 12v5M20 23v5M12 20h5M23 20h5" stroke="#eef1ff" stroke-width="2" stroke-linecap="round"/><circle cx="20" cy="20" r="2.6" fill="#ff4d6d"/><defs><linearGradient id="brandGrad" x1="6" y1="4" x2="34" y2="36"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs></svg>
    </span>
    <span class="brand-text"><strong>NEXUS</strong><small>GAME HELPER</small></span>
  </a>
  <div class="top-actions">
    <button class="icon-btn install-btn" id="installBtn" type="button" aria-label="Install app" title="Install app" hidden>
      <svg class="icon"><use href="#i-download"/></svg>
    </button>
    <button class="level-chip" type="button" data-open-profile aria-label="Open profile">
      <span class="level-chip-ring"><span id="topLevel">1</span></span>
      <span class="level-chip-text"><small>LEVEL</small><b id="topXp">0 XP</b></span>
    </button>
    <button class="avatar" type="button" data-open-profile aria-label="Open profile">NX</button>
  </div>
</header>

<main id="main" class="app-main" tabindex="-1"></main>

<nav class="tabbar" aria-label="Primary">
  <a href="#/home" data-route="home" class="tab"><svg class="icon"><use href="#i-home"/></svg><span>Home</span></a>
  <a href="#/aim" data-route="aim" class="tab"><svg class="icon"><use href="#i-target"/></svg><span>Aim</span></a>
  <a href="#/sens" data-route="sens" class="tab"><svg class="icon"><use href="#i-crosshair"/></svg><span>Sens</span></a>
  <a href="#/build" data-route="build" class="tab"><svg class="icon"><use href="#i-layers"/></svg><span>Build</span></a>
  <a href="#/codex" data-route="codex" class="tab"><svg class="icon"><use href="#i-book"/></svg><span>Codex</span></a>
</nav>

<aside class="profile-sheet" id="profileSheet" aria-label="Profile" aria-hidden="true">
  <div class="sheet-head">
    <span class="eyebrow">OPERATOR PROFILE</span>
    <button class="icon-btn" type="button" data-close-profile aria-label="Close profile"><svg class="icon"><use href="#i-x"/></svg></button>
  </div>
  <div id="profileContent" class="sheet-body"></div>
</aside>
<div class="scrim" id="scrim" hidden></div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>

<svg class="icon-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.6 12 3l9 7.6V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>

  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2c1.2 4.2 5.5 5.4 5.5 10a5.5 5.5 0 0 1-11 0c0-2.2 1.2-3.7 2.6-4.9.1 2.1 1 3.4 2.1 3.7.7-2.4.3-5.6.8-8.8z"/></symbol>

  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>

  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>

  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</svg>
</body>
</html>
